databases:
  - name: nutri-sense-db
    databaseName: nutrisense
    user: nutrisense_admin
    plan: free

services:
  - type: web
    name: nutri-sense
    env: static
    buildCommand: npm ci && npx turbo run build --filter=web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nutri-sense-api.onrender.com

  - type: web
    name: nutri-sense-api
    env: node
    plan: free
    buildCommand: npm ci && cd apps/api && npx prisma generate && npx prisma migrate deploy && cd ../.. && npx turbo run build --filter=@nutri-sense/api
    startCommand: node apps/api/dist/src/main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nutri-sense-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MQTT_HOST
        value: broker.hivemq.com
      - key: MQTT_PORT
        value: "1883"
