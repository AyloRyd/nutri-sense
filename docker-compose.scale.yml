version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: NutriSense
    ports:
      - "5433:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/NutriSense?schema=public
      - JWT_SECRET=zjP9h6ZI5LoSKCRj
      - MQTT_HOST=broker.hivemq.com
      - MQTT_PORT=1883
    depends_on:
      - db

  load_balancer:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "4000:80"
    depends_on:
      - api
